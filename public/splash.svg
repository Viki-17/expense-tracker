<!-- Theme source of truth: src/theme.ts -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="bgSplash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f0a"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <radialGradient id="glowSplash" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e3f675" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e3f675" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagSplash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a30"/>
      <stop offset="100%" stop-color="#1f2a18"/>
    </linearGradient>
    <linearGradient id="handSplash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c4b0"/>
    </linearGradient>
    <linearGradient id="ropeSplash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a35a"/>
      <stop offset="50%" stop-color="#e8d49a"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>
    <filter id="rupeeGlowSplash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="markGlowSplash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3f675" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e3f675" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgSplash)"/>
  <rect width="1080" height="1920" fill="url(#glowSplash)"/>
  
  <g transform="translate(540 820) scale(2.1) translate(-256 -255)">
    <circle cx="256" cy="200" r="130" fill="url(#markGlowSplash)"/>
    <!-- Hand holding the bag -->
    <g transform="translate(256 358)">
      <rect x="-84" y="28" width="168" height="44" rx="11" fill="#2a3a24"/>
      <rect x="-78" y="33" width="156" height="32" rx="8" fill="#1f2a18"/>
      <path d="M-88 32 C-88 8, -65 -10, -42 -10 L42 -10 C65 -10, 88 8, 88 32 C88 48, 75 58, 56 58 L-56 58 C-75 58, -88 48, -88 32 Z" fill="url(#handSplash)"/>
      <ellipse cx="-45" cy="-4" rx="20" ry="12" fill="url(#handSplash)"/>
      <ellipse cx="-3" cy="-8" rx="24" ry="14" fill="url(#handSplash)"/>
      <ellipse cx="40" cy="-4" rx="20" ry="12" fill="url(#handSplash)"/>
    </g>
    <!-- Money bag -->
    <g transform="translate(256 215)">
      <path d="M-70 82 C-90 62, -100 2, -80 -46 C-70 -76, -52 -92, -37 -107 L37 -107 C52 -92, 70 -76, 80 -46 C100 2, 90 62, 70 82 C52 106, -52 106, -70 82 Z" fill="url(#bagSplash)"/>
      <path d="M-38 -105 C-31 -122, 31 -122, 38 -105 C44 -92, 27 -85, 0 -85 C-27 -85, -44 -92, -38 -105 Z" fill="#2f3d26"/>
      <path d="M-40 -102 C-46 -112, 46 -112, 40 -102 C48 -95, 56 -85, 51 -75 C32 -65, -32 -65, -51 -75 C-56 -85, -48 -95, -40 -102 Z" fill="#3a4a30"/>
      <ellipse cx="0" cy="-95" rx="46" ry="14" stroke="url(#ropeSplash)" stroke-width="8" fill="none"/>
      <circle cx="50" cy="-95" r="9" fill="#e8d49a"/>
      <path d="M50 -95 Q68 -75 62 -48" stroke="url(#ropeSplash)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M50 -95 Q78 -78 74 -52" stroke="url(#ropeSplash)" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="62" cy="-48" r="5" fill="#e8d49a"/>
      <circle cx="74" cy="-52" r="5" fill="#e8d49a"/>
      <path d="M-56 -24 L-56 40" stroke="#4a5a40" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
      <path d="M56 -24 L56 40" stroke="#4a5a40" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
      <!-- Glowing vector rupee -->
      <g transform="translate(0 12) scale(0.95)" fill="#f0ffa0" filter="url(#rupeeGlowSplash)">
        
  <!-- Top bar -->
  <rect x="-32" y="-40" width="64" height="12" rx="2"/>
  <!-- Middle bar -->
  <rect x="-32" y="-14" width="44" height="10" rx="2"/>
  <!-- Diagonal stroke with the curved tail as one continuous filled path -->
  <path d="M -32,-40 L -20,-40 L 26,40 Q 34,40 42,48 Q 48,55 48,64 L 48,76 L 34,76 Q 28,64 18,48 L -32,-10 Z"/>
      </g>
      <ellipse cx="-30" cy="-40" rx="19" ry="27" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>
  <g text-anchor="middle">
    <text x="540" y="1180" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="78" letter-spacing="1">
      <tspan fill="#f0ffa0">Kai</tspan><tspan fill="#e8d49a">Kanakku</tspan>
    </text>
    <text x="540" y="1240" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" fill="#6a7a60" letter-spacing="6">PERSONAL EXPENSE TRACKER</text>
  </g>
</svg>
