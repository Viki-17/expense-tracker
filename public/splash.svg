<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="bgSplash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232816"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <linearGradient id="plateSplash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30361c"/>
      <stop offset="100%" stop-color="#181c10"/>
    </linearGradient>
    <radialGradient id="glowSplash" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e3f675" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#e3f675" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlowSplash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgSplash)"/>
  <rect width="1080" height="1920" fill="url(#glowSplash)"/>
  <g transform="translate(540 820) scale(1.55)">
