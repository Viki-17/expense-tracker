<!-- Theme source of truth: src/theme.ts -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a30"/>
      <stop offset="100%" stop-color="#1f2a18"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c4b0"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a35a"/>
      <stop offset="50%" stop-color="#e8d49a"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>
  </defs>

  <!-- Hand holding the bag -->
  <g transform="translate(256, 358)">
    <!-- Wrist / cuff -->
    <rect x="-84" y="28" width="168" height="44" rx="11" fill="#2a3a24"/>
    <rect x="-78" y="33" width="156" height="32" rx="8" fill="#1f2a18"/>
    <!-- Palm -->
    <path d="M-88 32 C-88 8, -65 -10, -42 -10 L42 -10 C65 -10, 88 8, 88 32 C88 48, 75 58, 56 58 L-56 58 C-75 58, -88 48, -88 32 Z" fill="url(#hand)"/>
    <!-- Fingers / thumb suggestion -->
    <ellipse cx="-45" cy="-4" rx="20" ry="12" fill="url(#hand)"/>
    <ellipse cx="-3" cy="-8" rx="24" ry="14" fill="url(#hand)"/>
    <ellipse cx="40" cy="-4" rx="20" ry="12" fill="url(#hand)"/>
  </g>

  <!-- Money bag -->
  <g transform="translate(256, 215)">
    <!-- Bag body -->
    <path d="M-70 82 C-90 62, -100 2, -80 -46 C-70 -76, -52 -92, -37 -107 L37 -107 C52 -92, 70 -76, 80 -46 C100 2, 90 62, 70 82 C52 106, -52 106, -70 82 Z" fill="url(#bag)"/>
    <!-- Bag top / cinched neck -->
    <path d="M-38 -105 C-31 -122, 31 -122, 38 -105 C44 -92, 27 -85, 0 -85 C-27 -85, -44 -92, -38 -105 Z" fill="#2f3d26"/>
    <path d="M-40 -102 C-46 -112, 46 -112, 40 -102 C48 -95, 56 -85, 51 -75 C32 -65, -32 -65, -51 -75 C-56 -85, -48 -95, -40 -102 Z" fill="#3a4a30"/>
    <!-- Rope tied around the neck -->
    <ellipse cx="0" cy="-95" rx="46" ry="14" stroke="url(#rope)" stroke-width="8" fill="none"/>
    <circle cx="50" cy="-95" r="9" fill="#e8d49a"/>
    <!-- Rope ends hanging down -->
    <path d="M50 -95 Q68 -75 62 -48" stroke="url(#rope)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M50 -95 Q78 -78 74 -52" stroke="url(#rope)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="-48" r="5" fill="#e8d49a"/>
    <circle cx="74" cy="-52" r="5" fill="#e8d49a"/>
    <!-- Stitching lines -->
    <path d="M-56 -24 L-56 40" stroke="#4a5a40" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
    <path d="M56 -24 L56 40" stroke="#4a5a40" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
    <!-- Rupee symbol -->
    <g fill="#e3f675">
      <path d="M-28 -44 L28 -44 L28 -32 L-28 -32 Z"/>
      <path d="M-28 -20 L18 -20 L18 -10 L-28 -10 Z"/>
      <path d="M-28 -44 L-16 -44 L28 42 L16 42 Z"/>
    </g>
    <!-- Shine highlight -->
    <ellipse cx="-30" cy="-40" rx="19" ry="27" fill="white" opacity="0.12"/>
  </g>
</svg>
